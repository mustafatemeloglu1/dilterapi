<style>

rd{border:2px solid #e4e8f1;background:#fff;border-radius:20px;overflow:hidden;text-align:left;padding:0;cursor:pointer;box-shadow:0 6px 16px rgba(23,35,57,.05)}.answer-card .aimg{height:145px;background:#f8fbff;display:grid;place-items:center}.answer-card .aimg svg{width:100%;height:145px}.answer-card .atext{padding:13px 14px 15px;font-weight:900;font-size:17px}.answer-card.good{border-color:var(--good);background:#ecfaf4}.answer-card.bad{border-color:var(--bad);background:#fff1f1}.feedback{min-height:28px;font-weight:800;margin-top:14px}.next{width:100%;border:0;background:var(--blue);color:#fff;border-radius:17px;padding:15px;font-weight:900;margin-top:14px;box-shadow:0 8px 18px rgba(79,124,255,.25)}.toolbar{display:flex;gap:8px;overflow:auto;margin:12px 0}.tool{border:0;border-radius:13px;padding:9px 12px;background:#e9eef8;font-weight:800;white-space:nowrap}.tool.active{background:var(--blue);color:#fff}.progress{height:8px;background:#e7ebf4;border-radius:999px;overflow:hidden;margin:8px 0 16px}.progress>div{height:100%;background:var(--blue);border-radius:999px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.mini-card .mini-img{height:140px;background:#f8fbff}.mini-card .mini-img svg{width:100%;height:140px}.mini-card .mini-body{padding:13px}.mini-card button{width:100%;border:0;background:#fff;text-align:left;font-weight:900;padding:0}.feedback-card{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:14px}.sequence-pool{display:grid;gap:10px;margin-top:10px}.seq-choice{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;border:2px solid #e6ebf3;background:#fff;border-radius:18px;padding:10px;cursor:pointer}.seq-choice .num{width:42px;height:42px;border-radius:14px;background:var(--blue2);display:grid;place-items:center;font-weight:900}.seq-choice.selected{border-color:var(--blue);background:#f1f5ff}.sequence-slots{display:grid;gap:8px;margin-top:10px}.slot{display:flex;gap:10px;align-items:center;border:2px dashed #c7d1e3;background:#fafcff;border-radius:16px;padding:10px}.slot .num{width:32px;height:32px;border-radius:50%;background:#e9eef8;display:grid;place-items:center;font-weight:900}.word-row{display:flex;gap:9px;overflow:auto;padding-bottom:6px}.word{border:2px solid #e5eaf2;background:#fff;border-radius:16px;padding:12px 15px;font-weight:900;white-space:nowrap}.sentence{min-height:66px;border:2px dashed #b9c4da;border-radius:18px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.token{background:#edf2ff;padding:9px 12px;border-radius:12px;font-weight:900}.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cat{background:#fff;border:0;border-radius:20px;box-shadow:var(--shadow);padding:14px;text-align:left;font-weight:900}.cat .cat-img{height:110px;background:#f7faff;border-radius:16px;overflow:hidden;margin-bottom:10px}.cat .cat-img svg{width:100%;height:110px}.cat small{display:block;color:var(--muted);margin-top:5px;font-weight:600;line-height:1.3}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid #e5eaf2;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:transparent;padding:12px 6px;color:#68758a;font-size:12px}.bottom b{display:block;color:var(--ink);margin-top:2px}.note{background:#eef6ff;border-radius:18px;padding:13px 14px;color:#35506f;line-height:1.45;margin:12px 0}.tagbar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.score{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}.score strong{font-size:20px}.image-label{text-align:center;font-weight:900;color:#334155;padding:7px 0 0}.small-btn{border:0;background:#edf2ff;color:#355bc4;border-radius:14px;padding:10px 12px;font-weight:900}.speaker{display:inline-flex;align-items:center;gap:6px;border:0;background:#eef4ff;color:#355bc4;border-radius:14px;padding:8px 11px;font-weight:900}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.muted{color:var(--muted)}
@media(max-width:560px){.grid{gap:11px;padding:12px}.menu{min-height:140px;padding:15px}.visual{min-height:220px}.visual svg{height:220px}.answer-card .aimg,.answer-card .aimg svg{height:135px}.list{grid-template-columns:1fr 1fr}.title{font-size:24px}.q{font-size:22px}}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<nav class="bottom"><button onclick="home()">⌂<b>Ana Sayfa</b></button><button onclick="openActivities()">▦<b>Etkinlikler</b></button><button onclick="openCategories()">◉<b>Kategoriler</b></button></nav>
<script>
const state={score:0,streak:0};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m));
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity='1';el.style.pointerEvents='auto';setTimeout(()=>{el.style.opacity='0';el.style.pointerEvents='none'},1400)}
const svg=(body,bg='#eef4ff')=>`<svg viewBox="0 0 420 250" xmlns="http://www.w3.org/2000/svg" aria-label="görsel"><rect width="420" height="250" rx="24" fill="${bg}"/>${body}</svg>`;
function person(x,y,body='#5b7cf6',shirt='#6cc38b',hair='#4b3c2e',sad=false){const mouth=sad?`<path d="M${x-7} ${y+11} Q ${x} ${y+4} ${x+7} ${y+11}" fill="none" stroke="#3b4659" stroke-width="3"/>`:`<path d="M${x-7} ${y+9} Q ${x} ${y+15} ${x+7} ${y+9}" fill="none" stroke="#3b4659" stroke-width="3"/>`;return `<circle cx="${x}" cy="${y}" r="24" fill="#ffd7b5"/><path d="M${x-22} ${y-8} Q ${x} ${y-35} ${x+22} ${y-8}" fill="${hair}"/><circle cx="${x-8}" cy="${y+2}" r="2.7" fill="#2b3340"/><circle cx="${x+8}" cy="${y+2}" r="2.7" fill="#2b3340"/>${mouth}<rect x="${x-30}" y="${y+26}" width="60" height="72" rx="20" fill="${shirt}"/><rect x="${x-42}" y="${y+38}" width="84" height="18" rx="9" fill="${shirt}"/><circle cx="${x-26}" cy="${y+58}" r="10" fill="#ffd7b5"/><circle cx="${x+26}" cy="${y+58}" r="10" fill="#ffd7b5"/><rect x="${x-23}" y="${y+98}" width="18" height="48" rx="9" fill="#2c3c5c"/><rect x="${x+5}" y="${y+98}" width="18" height="48" rx="9" fill="#2c3c5c"/>`}
function objectShape(kind,x,y,scale=1){const s=scale;switch(kind){case'book':return `<rect x="${x-32*s}" y="${y-20*s}" width="64" height="44" rx="6" fill="#ef6a6a"/><path d="M${x} ${y-20*s}V${y+22*s}" stroke="#fff" stroke-width="4"/><rect x="${x-25*s}" y="${y-13*s}" width="18*s" height="3*s" rx="2" fill="#fff" opacity=".9"/>`;case'ball':return `<circle cx="${x}" cy="${y}" r="28" fill="#ffcf53"/><path d="M${x-22} ${y-8}Q${x} ${y-26} ${x+22} ${y-8}M${x-18} ${y+15}Q${x} ${y+27} ${x+19} ${y+13}" stroke="#d68b28" stroke-width="4" fill="none"/>`;case'apple':return `<circle cx="${x}" cy="${y+2}" r="25" fill="#ef5b57"/><path d="M${x} ${y-24}Q${x+1} ${y-40} ${x+10} ${y-46}" stroke="#6b5135" stroke-width="7" stroke-linecap="round"/><ellipse cx="${x+14}" cy="${y-37}" rx="13" ry="7" fill="#6bc47f" transform="rotate(-20 ${x+14} ${y-37})"/>`;case'car':return `<rect x="${x-58}" y="${y-6}" width="116" height="44" rx="12" fill="#4f7cff"/><path d="M${x-32} ${y-6}L${x-10} ${y-36}H${x+26}L${x+44} ${y-6}" fill="#78a2ff"/><circle cx="${x-30}" cy="${y+39}" r="15" fill="#263247"/><circle cx="${x+30}" cy="${y+39}" r="15" fill="#263247"/>`;case'fish':return `<ellipse cx="${x}" cy="${y}" rx="42" ry="25" fill="#5da9e9"/><path d="M${x-42} ${y}L${x-68} ${y-20}V${y+20}Z" fill="#4b83c4"/><circle cx="${x+20}" cy="${y-4}" r="4" fill="#263247"/>`;case'flower':return `<circle cx="${x}" cy="${y-18}" r="12" fill="#f17bb4"/><circle cx="${x+16}" cy="${y-8}" r="12" fill="#f17bb4"/><circle cx="${x+10}" cy="${y+9}" r="12" fill="#f17bb4"/><circle cx="${x-10}" cy="${y+9}" r="12" fill="#f17bb4"/><circle cx="${x-16}" cy="${y-8}" r="12" fill="#f17bb4"/><circle cx="${x}" cy="${y-2}" r="10" fill="#ffd85a"/><rect x="${x-4}" y="${y+9}" width="8" height="70" rx="4" fill="#62af6d"/><path d="M${x} ${y+45}Q${x-25} ${y+30} ${x-38} ${y+45}" stroke="#62af6d" stroke-width="7" fill="none"/>`;case'cup':return `<rect x="${x-22}" y="${y-32}" width="44" height="60" rx="8" fill="#f3c969"/><path d="M${x+22} ${y-18}Q${x+48} ${y-18} ${x+48} ${y}Q${x+48} ${y+19} ${x+22} ${y+17}" fill="none" stroke="#d2a548" stroke-width="8"/>`;case'spoon':return `<ellipse cx="${x}" cy="${y-24}" rx="13" ry="18" fill="#b5c2d1"/><rect x="${x-5}" y="${y-10}" width="10" height="75" rx="5" fill="#b5c2d1"/>`;case'banana':return `<path d="M${x-30} ${y-5}Q${x} ${y+48} ${x+36} ${y-18}" stroke="#f2c94c" stroke-width="24" fill="none" stroke-linecap="round"/><path d="M${x-38} ${y-14}L${x-28} ${y-28}" stroke="#7b5b2b" stroke-width="7" stroke-linecap="round"/>`;case'bed':return `<rect x="${x-75}" y="${y-5}" width="150" height="52" rx="10" fill="#8bb8e8"/><rect x="${x-70}" y="${y-50}" width="70" height="48" rx="8" fill="#fff"/><rect x="${x-82}" y="${y+48}" width="12" height="40" rx="6" fill="#6a7a90"/><rect x="${x+60}" y="${y+48}" width="12" height="40" rx="6" fill="#6a7a90"/>`;case'bus':return `<rect x="${x-78}" y="${y-42}" width="156" height="92" rx="18" fill="#f3bb45"/><rect x="${x-60}" y="${y-22}" width="40" height="28" rx="6" fill="#c9ecff"/><rect x="${x-10}" y="${y-22}" width="40" height="28" rx="6" fill="#c9ecff"/><rect x="${x+40}" y="${y-22}" width="18" height="54" rx="6" fill="#c9ecff"/><circle cx="${x-44}" cy="${y+54}" r="15" fill="#273247"/><circle cx="${x+44}" cy="${y+54}" r="15" fill="#273247"/>`;case'plate':return `<ellipse cx="${x}" cy="${y}" rx="52" ry="33" fill="#fff" stroke="#c9d3e2" stroke-width="6"/>`;case'ice':return `<polygon points="${x-30},${y+25} ${x-2},${y-28} ${x+32},${y+25}" fill="#bfe4ff"/><circle cx="${x+6}" cy="${y+5}" r="12" fill="#eefaff"/>`;case'gift':return `<rect x="${x-45}" y="${y-15}" width="90" height="72" rx="8" fill="#f16666"/><path d="M${x} ${y-15}V${y+57}" stroke="#ffe06c" stroke-width="12"/><path d="M${x-45} ${y+5}H${x+45}" stroke="#ffe06c" stroke-width="12"/><path d="M${x} ${y-15}Q${x-18} ${y-38} ${x-4} ${y-49}Q${x+12} ${y-31} ${x} ${y-15}M${x} ${y-15}Q${x+18} ${y-38} ${x+4} ${y-49}" fill="#f16666" stroke="#ffe06c" stroke-width="5"/>`;case'umbrella':return `<path d="M${x-60} ${y}Q${x} ${y-54} ${x+60} ${y}" fill="#66a9e9"/><path d="M${x} ${y}V${y+48}Q${x} ${y+62} ${x+16} ${y+62}" stroke="#56657a" stroke-width="8" fill="none"/>`;case'house':return `<path d="M${x-72} ${y-10}L${x} ${y-70}L${x+72} ${y-10}Z" fill="#ed8675"/><rect x="${x-58}" y="${y-10}" width="116" height="86" rx="10" fill="#fff2df"/><rect x="${x-14}" y="${y+24}" width="28" height="52" rx="5" fill="#8d6a4e"/>`;case'park':return `<rect x="${x-88}" y="${y+38}" width="176" height="18" rx="9" fill="#7cbd72"/><circle cx="${x-48}" cy="${y-8}" r="28" fill="#79b86f"/><rect x="${x-52}" y="${y+18}" width="8" height="47" fill="#9d6c4b"/><circle cx="${x+35}" cy="${y-2}" r="30" fill="#6fb26b"/><rect x="${x+31}" y="${y+23}" width="8" height="42" fill="#9d6c4b"/>`;case'calendar':return `<rect x="${x-48}" y="${y-42}" width="96" height="110" rx="14" fill="#fff" stroke="#d8e0ec" stroke-width="5"/><rect x="${x-48}" y="${y-42}" width="96" height="28" rx="14" fill="#4f7cff"/><circle cx="${x-22}" cy="${y-7}" r="5" fill="#4f7cff"/><circle cx="${x}" cy="${y-7}" r="5" fill="#4f7cff"/><circle cx="${x+22}" cy="${y-7}" r="5" fill="#4f7cff"/>`;case'cloud':return `<path d="M${x-52} ${y+25}Q${x-58} ${y-8} ${x-22} ${y-8}Q${x-12} ${y-42} ${x+20} ${y-25}Q${x+54} ${y-28} ${x+56} ${y+9}Q${x+78} ${y+10} ${x+72} ${y+25}Z" fill="#fff"/>`;case'sun':return `<circle cx="${x}" cy="${y}" r="28" fill="#ffd45a"/>${[0,45,90,135].map(a=>{let r=Math.PI*a/180;return `<path d="M${x+38*Math.cos(r)} ${y+38*Math.sin(r)}L${x+57*Math.cos(r)} ${y+57*Math.sin(r)}M${x-38*Math.cos(r)} ${y-38*Math.sin(r)}L${x-57*Math.cos(r)} ${y-57*Math.sin(r)}" stroke="#f2bf3b" stroke-width="7" stroke-linecap="round"/>`}).join('')}`;case'toothbrush':return `<rect x="${x-8}" y="${y-55}" width="16" height="105" rx="8" fill="#5f8cff"/><rect x="${x-14}" y="${y-70}" width="28" height="24" rx="6" fill="#b7d3ff"/><path d="M${x-12} ${y-70}V${y-88}M${x-2} ${y-70}V${y-90}M${x+8} ${y-70}V${y-86}" stroke="#fff" stroke-width="4"/>`;case'phone':return `<rect x="${x-30}" y="${y-58}" width="60" height="116" rx="14" fill="#263247"/><rect x="${x-23}" y="${y-43}" width="46" height="80" rx="6" fill="#a9d9ff"/><circle cx="${x}" cy="${y+46}" r="5" fill="#fff"/>`;case'knife':return `<path d="M${x-62} ${y+14}L${x+24} ${y-32}Q${x+52} ${y-35} ${x+30} ${y-8}L${x-28} ${y+24}Z" fill="#cad4df"/><rect x="${x-58}" y="${y+12}" width="46" height="14" rx="7" fill="#8b5d3c" transform="rotate(-24 ${x-58} ${y+12})"/>`;default:return `<circle cx="${x}" cy="${y}" r="28" fill="#dce7f7"/>`}}
function scene(type,variant=0){let bg=['#eef4ff','#edf8f0','#fff3ea','#f7efff','#fffbea','#eefbff'][variant%6];
if(type==='bird'||type==='fly')return svg(`<ellipse cx=210 cy=126 rx=56 ry=36 fill='#9ed6ff'/><circle cx=232 cy=108 r=24 fill='#9ed6ff'/><circle cx=241 cy=103 r=4 fill='#24334a'/><path d='M255 108l25 9-25 8z' fill='#efb34a'/><path d='M190 122Q145 82 128 126Q148 116 188 137' fill='#78b9ea'/><path d='M278 121q18 0 31 12' stroke='#78b9ea' stroke-width=7 fill='none' stroke-linecap='round'/><path d='M125 74q15-15 30 0M286 72q16-15 31 0' stroke='#78b9ea' stroke-width=5 fill='none' stroke-linecap='round'/>`,bg);
if(type==='cat')return svg(`<circle cx=210 cy=125 r=46 fill='#d6a676'/><path d='M170 94L174 58L202 82M248 82L276 58L280 94' fill='#c18b5f'/><circle cx=195 cy=120 r=5 fill='#273247'/><circle cx=225 cy=120 r=5 fill='#273247'/><path d='M204 135Q210 142 216 135' stroke='#7a4935' stroke-width=4 fill='none' stroke-linecap='round'/>`,bg);
if(type==='shirt')return svg(`<path d='M160 72L192 54L210 76L228 54L260 72L245 112L230 105V190H190V105L175 112Z' fill='#62aee8'/><path d='M192 54Q210 75 228 54' fill='none' stroke='#4b8fca' stroke-width=6/>`,bg);
if(type==='spoon')return svg(objectShape('spoon',210,135),bg);
if(type==='door')return svg(`<rect x='150' y='45' width='120' height='155' rx='12' fill='#b98660'/><rect x='160' y='55' width='100' height='145' rx='10' fill='#e8c19d'/><circle cx='238' cy='132' r='7' fill='#806044'/><path d='M160 55L220 28L270 45' fill='#c8946d'/><path d='M302 80l22 22m0-22-22 22' stroke='#e85d5d' stroke-width='6' stroke-linecap='round'/>`,bg);

function header(title,sub){return `<div class="section"><div class="section-head"><div><span class="pill">DilTerapi</span><div class="title">${esc(title)}</div><div class="hint">${esc(sub)}</div></div><button class="small-btn" onclick="home()">Ana sayfa</button></div></div>`}
function home(){document.getElementById('app').innerHTML=`<header class="top"><div class="brand">Dil<span>Terapi</span></div><div class="sub">Görsel dil, konuşma, cümle ve pragmatik beceri çalışmaları</div></header><div class="grid">${[['5N1K','Kim • Ne • Nerede • Ne zaman • Nasıl • Neden','5N1K'],['Evet / Hayır','Doğru cevabı görselden seç','Evet / Hayır'],['Duygular','Duyguyu tanı ve adlandır','Duygular'],['Duygu Nedenleri','Neden böyle hissediyor?','Duygu Nedenleri'],['Empati','Günlük sosyal durumları anla','Empati'],['Günlük Kurallar','Ev • okul • sokak • market','Günlük Kurallar'],['Zıt Kavramlar','Büyük • küçük • sıcak • soğuk','Zıt Kavramlar'],['Olay Sıralama','Olayları kronolojik sıraya koy','Olay Sıralama'],['Cümle Oluşturma','1 kelimeden 5+ kelimeye','Cümle Oluşturma'],['Eylem İsimlendirme','75 temel eylem – tek tek kartlar','Eylem İsimlendirme'],['Ekler','20 sık kullanılan ek – görsel örnek','Ekler'],['Kelime Kategorileri','Taşıt • meyve • sebze • hayvan…','Kelime Kategorileri']].map(x=>`<button class="menu" onclick="openSection('${esc(x[2])}')"><div class="ico">${iconSvg(x[2])}</div><b>${esc(x[0])}</b><small>${esc(x[1])}</small></button>`).join('')}</div><div class="section"><div class="note"><b>Kart yaklaşımı:</b> Büyük görsel → kısa soru → ayrı cevap kartları. Çocuk cevabı seçtikçe anında geri bildirim alır.</div><div class="score"><span>Oturum puanı</span><strong>${state.score}</strong></div></div>`}
function openActivities(){home();window.scrollTo({top:0,behavior:'smooth'})}
function openCategories(){categories()}
function openSection(type){if(type==='5N1K')return fiveHome();if(type==='Evet / Hayır')return quizGeneric('Evet / Hayır',yesNo.map(x=>({q:x[0],scene:x[1],opts:x[3].map(o=>[o[0],o[1]||x[1]]),a:x[3].findIndex(o=>o[0]===x[2]),answerText:x[2]})));if(type==='Duygular')return emotionsPage();if(type==='Duygu Nedenleri')return reasonsPage();if(type==='Empati')return simpleMulti('Empati',empathy,true);if(type==='Günlük Kurallar')return simpleMulti('Günlük Kurallar',rules,true);if(type==='Zıt Kavramlar')return contrastsPage();if(type==='Olay Sıralama')return sequencePage();if(type==='Cümle Oluşturma')return sentencesPage();if(type==='Eylem İsimlendirme')return actionsPage();if(type==='Ekler')return suffixPage();if(type==='Kelime Kategorileri')return categories()}
function fiveHome(){document.getElementById('app').innerHTML=`${header('5N1K','Her soru türü ayrı çalışma alanında. Her bölümde 30 kart bulunur.') }<div class="grid">${['Ne','Kim','Nerede','Ne Zaman','Nasıl','Neden'].map((k,i)=>`<button class="menu" onclick="quizFive('${k}')"><div class="ico">${iconSvg(k)}</div><b>${esc(k)}</b><small>30 soru • görsel soru + büyük cevap kartları</small></button>`).join('')}</div>`}
function quizFive(k){const arr=five[k];quizGeneric('5N1K • '+k,arr)}
function quizGeneric(title,arr){let i=0;const render=()=>{const d=arr[i%arr.length];const opts=d.opts.map((o,k)=>`<button class="answer-card" onclick="answer(this,${k},${d.a||0},'${esc(title)}',${i})"><div class="aimg">${scene(o[1]||d.scene,(k+i)%6)}</div><div class="atext">${esc(o[0])}</div></button>`).join('');document.getElementById('app').innerHTML=`${header(title,`${i%arr.length+1}. kart / ${arr.length}`)}<div class="section"><div class="progress"><div style="width:${((i%arr.length+1)/arr.length)*100}%"></div></div><div class="card"><div class="visual">${scene(d.scene,i%6)}</div><div class="body"><div class="q">${esc(d.q)}</div><button class="speaker" onclick="say('${esc(d.q)}')">🔊 Soruyu dinle</button><div class="answer-grid">${opts}</div><div id="fb" class="feedback"></div><button class="next" onclick="${title.startsWith('5N1K')?'nextFive':'nextQuiz'}()">Sonraki kart →</button></div></div></div>`};window.nextQuiz=()=>{i=(i+1)%arr.length;render()};window.nextFive=()=>{i=(i+1)%arr.length;render()};render()}
function answer(btn,k,a,title,i){document.querySelectorAll('.answer-card').forEach(b=>b.disabled=true);const good=k===a;btn.classList.add(good?'good':'bad');if(!good){const all=[...document.querySelectorAll('.answer-card')];if(all[a])all[a].classList.add('good')}const fb=document.getElementById('fb');fb.innerHTML=good?`<span style="color:var(--good)">★ Harika! Doğru cevap.</span>`:`<span style="color:var(--bad)">↻ Tekrar düşünelim. Doğru seçenek işaretlendi.</span>`;if(good){state.score++;toast('Doğru cevap!')}}
function simpleMulti(title,arr){quizGeneric(title,arr.map(x=>({q:x[0],scene:x[1],opts:x[2].map((t,j)=>[t,x[1]]),a:x[3]})))}
function emotionsPage(){let i=0;const render=()=>{let d=emotions[i%emotions.length];document.getElementById('app').innerHTML=`${header('Duygular','Emoji yerine çocukların gerçek durumları anlatan resimli sahneler kullanılır.') }<div class="section"><div class="progress"><div style="width:${((i%emotions.length+1)/emotions.length)*100}%"></div></div><div class="card"><div class="visual">${scene(d[1],i)}</div><div class="body"><div class="q">${esc(d[0])}</div><div class="answer-grid three">${d[3].map((t,k)=>`<button class="answer-card" onclick="emotionAnswer(this,${k},${d[4]},'${esc(t)}')"><div class="aimg">${scene(d[1],k+2)}</div><div class="atext">${esc(t)}</div></button>`).join('')}</div><div id="fb" class="feedback"></div><button class="next" onclick="i=(i+1)%emotions.length;render()">Sonraki duygu →</button></div></div></div>`};window.emotionAnswer=(b,k,a)=>answer(b,k,a,'Duygular',i);render()}
function reasonsPage(){let i=0;const render=()=>{let d=reasons[i%reasons.length];document.getElementById('app').innerHTML=`${header('Duygu Nedenleri','Önce duyguyu gör, sonra hangi olayın buna neden olduğunu seç.') }<div class="section"><div class="progress"><div style="width:${((i%reasons.length+1)/reasons.length)*100}%"></div></div><div class="card"><div class="visual">${scene(d[1],i)}</div><div class="body"><div class="q">${esc(d[0])}</div><div class="answer-grid">${d[2].map((t,k)=>`<button class="answer-card" onclick="reasonAnswer(this,${k},${d[3]})"><div class="aimg">${scene(k===0?d[1]:'food',k+2)}</div><div class="atext">${esc(t)}</div></button>`).join('')}</div><div id="fb" class="feedback"></div><button class="next" onclick="i=(i+1)%reasons.length;render()">Sonraki →</button></div></div></div>`};window.reasonAnswer=(b,k,a)=>answer(b,k,a,'Duygu Nedenleri',i);render()}
function contrastsPage(){let i=0;const render=()=>{const d=contrasts[i%contrasts.length];document.getElementById('app').innerHTML=`${header('Zıt Kavramlar','İki büyük görseli karşılaştır ve doğru kavramı seç.') }<div class="section"><div class="card"><div class="visual">${scene(i%2?'weather':'park',i)}</div><div class="body"><div class="q">${esc(d[3])}: Hangisi?</div><div class="answer-grid two">${[['Birinci',d[0]],['İkinci',d[1]]].map((o,k)=>`<button class="answer-card" onclick="answer(this,${k},${k===0?0:1},'Zıt Kavramlar',${i})"><div class="aimg">${scene(k===0?'park':'weather',k+2)}</div><div class="atext">${esc(o[1])}</div></button>`).join('')}</div><div id="fb" class="feedback"></div><button class="next" onclick="i=(i+1)%contrasts.length;render()">Sonraki zıt kavram →</button></div></div></div>`};render()}
function sequencePage(){let idx=0;let selected=[];const render=()=>{const set=seqSets[idx%seqSets.length];const shuffled=[...set[1]].sort(()=>Math.random()-.5);selected=[];document.getElementById('app').innerHTML=`${header('Olay Sıralama',`“${set[0]}” olaylarını karışık kartlardan doğru sıraya koy.`)}<div class="section"><div class="card"><div class="body"><div class="q">Doğru kronolojik sıra</div><div class="sequence-slots" id="slots">${set[1].map((_,n)=>`<div class="slot"><div class="num">${n+1}</div><span class="muted">Buraya bir kart seç</span></div>`).join('')}</div><div class="sequence-pool">${shuffled.map((x,j)=>`<button class="seq-choice" data-id="${j}" onclick="pickSeq(this,'${esc(x[0])}')"><div class="num">+</div><div><b>${esc(x[0])}</b><div class="muted" style="font-size:12px">Dokunarak sıraya ekle</div></div></button>`).join('')}</div><button class="next" onclick="checkSeq(${idx})">Sıramı kontrol et</button><button class="small-btn" style="margin-top:10px;width:100%" onclick="idx=(idx+1)%seqSets.length;render()">Yeni olay</button><div id="seqfb" class="feedback"></div></div></div></div>`};window.pickSeq=(btn,text)=>{if(selected.length>=seqSets[idx%seqSets.length][1].length)return;selected.push(text);btn.classList.add('selected');const slots=document.querySelectorAll('.slot');slots[selected.length-1].innerHTML=`<div class="num">${selected.length}</div><b>${esc(text)}</b>`};window.checkSeq=(i)=>{const target=seqSets[i%seqSets.length][1].map(x=>x[0]);const ok=selected.join('|')===target.join('|');document.getElementById('seqfb').innerHTML=ok?'<span style="color:var(--good)">★ Harika! Olayları doğru sıraya koydun.</span>':'<span style="color:var(--bad)">↻ Sıra henüz doğru değil. Tekrar deneyebilirsin.</span>';if(ok){state.score++;toast('Sıralama doğru!')}};render()}
function sentencesPage(){let stage=1;let cur=[];const sets={1:[{scene:'run',words:['Koşuyor.'],target:['Koşuyor.']}],2:[{scene:'run',words:['Çocuk','koşuyor.'],target:['Çocuk','koşuyor.']},{scene:'eat',words:['Çocuk','yiyor.'],target:['Çocuk','yiyor.']}],3:[{scene:'eat',words:['Çocuk','elmayı','yiyor.'],target:['Çocuk','elmayı','yiyor.']},{scene:'play',words:['Çocuk','topla','oynuyor.'],target:['Çocuk','topla','oynuyor.']}],4:[{scene:'park',words:['Çocuk','parkta','top','oynuyor.'],target:['Çocuk','parkta','top','oynuyor.']}],5:[{scene:'school',words:['Çocuk','sabah','çantayı','alıp','okula','gidiyor.'],target:['Çocuk','sabah','çantayı','alıp','okula','gidiyor.']}]};let item=0;const render=()=>{const arr=sets[stage];const d=arr[item%arr.length];cur=[];document.getElementById('app').innerHTML=`${header('Cümle Oluşturma','Resmi incele. Kelime kartlarına dokunarak cümleyi kur.')}<div class="section"><div class="toolbar">${[1,2,3,4,5].map(n=>`<button class="tool ${stage===n?'active':''}" onclick="stage=${n};item=0;render()">${n} kelime</button>`).join('')}</div><div class="card"><div class="visual">${scene(d.scene,stage)}</div><div class="body"><div class="q">Resme bak ve cümleyi oluştur.</div><div class="sentence" id="sentence"></div><div class="word-row">${d.words.concat(stage>=4?['çocuk','parkta']:[]).map((w,j)=>`<button class="word" onclick="addSentence('${esc(w)}')">${esc(w)}</button>`).join('')}</div><button class="next" onclick="checkSentence()">Cümleyi kontrol et</button><button class="small-btn" style="margin-top:10px;width:100%" onclick="item=(item+1)%arr.length;render()">Başka örnek</button><div id="sfb" class="feedback"></div></div></div></div>`};window.addSentence=w=>{if(cur.length<8){cur.push(w);document.getElementById('sentence').insertAdjacentHTML('beforeend',`<span class="token">${esc(w)}</span>`)}};window.checkSentence=()=>{const target=sets[stage][item%sets[stage].length].target.join(' ');const got=cur.join(' ');document.getElementById('sfb').innerHTML=got===target?'<span style="color:var(--good)">★ Cümle doğru!</span>':'<span style="color:var(--bad)">↻ Kelimeleri tekrar düzenleyelim.</span>';if(got===target){state.score++;toast('Cümle doğru!')}};render()}
function actionsPage(){let i=0;const render=()=>{document.getElementById('app').innerHTML=`${header('Eylem İsimlendirme','Her eylem ayrı büyük bir kart. Görsele bak ve eylemi söyle.') }<div class="section"><div class="progress"><div style="width:${((i%actions.length+1)/actions.length)*100}%"></div></div><div class="card"><div class="visual">${scene(actions[i%actions.length][1],i)}</div><div class="body"><div class="q">${esc(actions[i%actions.length][0])}</div><button class="speaker" onclick="say('${esc(actions[i%actions.length][0])}')">🔊 Eylemi dinle</button><button class="next" onclick="i=(i+1)%actions.length;render()">Sonraki eylem →</button></div></div><div class="note">Toplam ${actions.length} eylem. Önce görseli göster, çocuğun isimlendirmesini bekle; sonra kelimeyi aç.</div></div>`};render()}
function suffixPage(){let i=0;const render=()=>{const d=suffixes[i%suffixes.length];document.getElementById('app').innerHTML=`${header('Ekler','Sık kullanılan Türkçe ekleri görsel cümlelerle çalış.')}<div class="section"><div class="progress"><div style="width:${((i%suffixes.length+1)/suffixes.length)*100}%"></div></div><div class="card"><div class="visual">${scene(d[4],i)}</div><div class="body"><div class="pill">${esc(d[0])}</div><div class="q" style="margin-top:10px">${esc(d[1])}</div><div class="note"><b>${esc(d[2])}</b> → <b>${esc(d[3])}</b></div><button class="speaker" onclick="say('${esc(d[1])}')">🔊 Cümleyi dinle</button><button class="next" onclick="i=(i+1)%suffixes.length;render()">Sonraki ek →</button></div></div></div>`};render()}
function categories(){document.getElementById('app').innerHTML=`${header('Kelime Kategorileri','Önce kategori seç. Sonra o kategoride her kelime ayrı bir görsel kart olarak açılır.')}<div class="section"><div class="list">${Object.entries(cats).map(([k,v])=>`<button class="cat" onclick="categoryWords('${esc(k)}')"><div class="cat-img">${scene(v[0][1],0)}</div>${esc(k)}<small>${v.length} kelime • tek tek görsel kartlar</small></button>`).join('')}</div></div>`}
function categoryWords(k){const arr=cats[k]||[];let i=0;const render=()=>{const d=arr[i%arr.length];document.getElementById('app').innerHTML=`${header(k,'Kelimeyi gör, adını söyle ve sonraki karta geç.')}<div class="section"><div class="progress"><div style="width:${((i%arr.length+1)/arr.length)*100}%"></div></div><div class="card"><div class="visual">${scene(d[1],i)}</div><div class="body"><div class="q">${esc(d[0])}</div><button class="speaker" onclick="say('${esc(d[0])}')">🔊 Kelimeyi dinle</button><button class="next" onclick="i=(i+1)%arr.length;render()">Sonraki kelime →</button></div></div></div>`};render()}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
home();
</script>
</body>
