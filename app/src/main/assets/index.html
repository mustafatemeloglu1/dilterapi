<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Dil Terapi</title><style>
:root{--bg:#f5f7fb;--ink:#172033;--muted:#667085;--blue:#4f7cff;--card:#fff;--good:#18a56a;--bad:#e85d5d;--shadow:0 10px 28px #15203312}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}button{font:inherit}#app{max-width:720px;margin:auto;padding-bottom:90px}.top{padding:26px 18px 14px;background:linear-gradient(180deg,#fff,#f5f7fb)}.brand{font-weight:800;font-size:24px}.brand span{color:var(--blue)}.sub{color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px}.menu{border:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px;text-align:left;min-height:142px;cursor:pointer}.menu .ico{font-size:42px}.menu b{display:block;font-size:18px;margin-top:10px}.menu small{color:var(--muted)}.section{padding:14px 16px}.back{border:0;background:#e9edf7;border-radius:14px;padding:10px 14px;margin-bottom:12px}.title{font-size:25px;font-weight:800;margin:8px 0}.hint{color:var(--muted);margin-bottom:15px}.cards{display:grid;gap:14px}.card{background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.visual{height:190px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef4ff,#f9fbff);font-size:90px}.body{padding:18px}.q{font-size:22px;font-weight:800;line-height:1.25}.options{display:grid;gap:10px;margin-top:16px}.opt{border:2px solid #e5e9f2;background:#fff;border-radius:17px;padding:14px;text-align:center;font-weight:700}.opt:active{transform:scale(.98)}.good{border-color:var(--good)!important;background:#e9fbf3!important}.bad{border-color:var(--bad)!important;background:#fff0f0!important}.feedback{font-weight:700;margin-top:12px;min-height:22px}.next{width:100%;border:0;background:var(--blue);color:#fff;border-radius:16px;padding:14px;font-weight:800;margin-top:14px}.pill{display:inline-block;background:#edf2ff;color:#355bc4;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border:2px solid #e7eaf0;background:#fff;border-radius:18px;padding:12px;text-align:center}.mini .pic{font-size:54px}.mini b{display:block;margin-top:5px}.sort{display:grid;gap:10px}.sortcard{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #e7eaf0;border-radius:18px;padding:12px}.sortcard .num{width:34px;height:34px;border-radius:50%;background:#edf2ff;display:grid;place-items:center;font-weight:800}.row{display:flex;gap:10px;overflow:auto;padding-bottom:6px}.word{border:2px solid #e7eaf0;background:#fff;border-radius:16px;padding:12px 16px;font-weight:800;white-space:nowrap}.sentence{min-height:62px;border:2px dashed #b9c4da;border-radius:18px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.token{background:#edf2ff;padding:9px 12px;border-radius:12px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(14px);border-top:1px solid #e7eaf0;display:flex;justify-content:center;z-index:10}.bottom button{flex:1;max-width:180px;border:0;background:transparent;padding:13px 5px;color:#667085;font-size:12px}.bottom b{display:block;color:#172033}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#172033;color:white;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1}.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{background:#fff;border:0;border-radius:18px;box-shadow:var(--shadow);padding:16px;text-align:left;font-weight:800}.cat span{font-size:30px;display:block;margin-bottom:8px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.list{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div><nav class="bottom"><button onclick="home()">⌂<b>Ana Sayfa</b></button><button onclick="show('activities')">▦<b>Etkinlikler</b></button><button onclick="show('categories')">◉<b>Kategoriler</b></button></nav><script>
const A=[['Koşmak','🏃'],['Yürümek','🚶'],['Oturmak','🪑'],['Kalkmak','⬆️'],['Yemek','🍽️'],['İçmek','🥤'],['Uyumak','😴'],['Açmak','🚪'],['Kapatmak','🔒'],['Almak','🤲'],['Vermek','🎁'],['Atmak','⚾'],['Tutmak','✋'],['Taşımak','📦'],['Yıkamak','🧼'],['Giymek','👕'],['Çıkarmak','👕'],['Okumak','📖'],['Yazmak','✏️'],['Çizmek','🖍️'],['Kesmek','✂️'],['Yapıştırmak','📎'],['Oynamak','🧸'],['Konuşmak','🗣️'],['Dinlemek','👂'],['Bakmak','👀'],['Görmek','👁️'],['Duymak','👂'],['Söylemek','💬'],['Sormak','❓'],['Cevaplamak','✅'],['Gülmek','😄'],['Ağlamak','😢'],['Sevmek','❤️'],['İstemek','🙋'],['Beklemek','⏳'],['Vermek','🤲'],['Getirmek','📦'],['Götürmek','➡️'],['Koşmak','🏃'],['Zıplamak','🦘'],['Tırmanmak','🧗'],['Düşmek','⬇️'],['Kalkmak','🧍'],['Binmek','🚌'],['İnmek','🚶'],['Sürmek','🚗'],['Yüzmek','🏊'],['Uçmak','✈️'],['Yakalamak','🫴'],['Bırakmak','🖐️'],['Koymak','📍'],['Çekmek','↩️'],['İtmek','➡️'],['Dökmek','🥤'],['Doldurmak','🫗'],['Boşaltmak','🪣'],['Pişirmek','🍳'],['Kesmek','🔪'],['Soymak','🍌'],['Yemek','🍎'],['İçmek','💧'],['Temizlemek','🧽'],['Toplamak','🧺'],['Aramak','🔎'],['Bulmak','🔍'],['Kaybetmek','❓'],['Hatırlamak','💡'],['Unutmak','🤔'],['Girmek','🚪'],['Çıkmak','🚶'],['Açılmak','🚪'],['Kapanmak','🚪'],['Hazırlamak','🧰'],['Paylaşmak','🤝']];
const data={
'5N1K':[{q:'Kim hırsızları yakalar?',opts:['👮 Polis','👨‍🍳 Aşçı','🧑‍🌾 Çiftçi'],a:0,p:'👮'},{q:'Çocuk ne yiyor?',opts:['🍎 Elma','⚽ Top','📚 Kitap'],a:0,p:'🍎'},{q:'Çocuk nerede ders çalışıyor?',opts:['🏫 Okulda','🏖️ Plajda','🛒 Markette'],a:0,p:'🏫'},{q:'Ne zaman uyanırız?',opts:['☀️ Sabah','🌙 Gece','🌧️ Yağmur'],a:0,p:'☀️'},{q:'Çocuk nasıl gidiyor?',opts:['🏃 Koşarak','😴 Uyuyarak','🪑 Oturarak'],a:0,p:'🏃'},{q:'Çocuk neden şemsiye taşıyor?',opts:['☔ Yağmur yağıyor','☀️ Güneş açtı','🍎 Elma yiyor'],a:0,p:'☔'}],
'Evet / Hayır':[{q:'Kuş yüzer mi?',opts:['❌ Hayır','✅ Evet'],a:0,p:'🐦'},{q:'Balığın ayağı var mıdır?',opts:['❌ Hayır','✅ Evet'],a:0,p:'🐟'},{q:'Güneş gece doğar mı?',opts:['❌ Hayır','✅ Evet'],a:0,p:'☀️'},{q:'Kedi miyavlar mı?',opts:['❌ Hayır','✅ Evet'],a:1,p:'🐱'}],
'Duygular':[{q:'Çocuk nasıl hissediyor?',opts:['😢 Üzgün','😄 Mutlu','😡 Kızgın'],a:0,p:'😢'},{q:'Çocuk nasıl hissediyor?',opts:['😨 Korkmuş','😄 Mutlu','😴 Yorgun'],a:1,p:'🎁🙂'},{q:'Çocuk nasıl hissediyor?',opts:['😡 Kızgın','😄 Mutlu','😢 Üzgün'],a:0,p:'😡'}],
'Duygu Nedenleri':[{q:'Çocuk neden ağlıyor?',opts:['🧸💔 Oyuncağı kırıldı','🍫 Çikolata yiyor'],a:0,p:'😢'},{q:'Çocuk neden mutlu?',opts:['🎁 Hediye aldı','☔ Yağmurda ıslandı'],a:0,p:'🙂'},{q:'Çocuk neden korkmuş?',opts:['🐕 Büyük köpek gördü','🍎 Elma yedi'],a:0,p:'😨'}],
'Empati':[{q:'Arkadaşın düştü ve ağlıyor. Ne yapmalısın?',opts:['🤝 Yardım et','😂 Gül','🏃 Uzaklaş'],a:0,p:'🧒😢'},{q:'Arkadaşın üzgün. Ne söyleyebilirsin?',opts:['“İyi misin?”','“Git buradan!”','“Sus!”'],a:0,p:'💬'},{q:'Bir arkadaşın oyuncağını paylaşmak istiyor. Ne yaparsın?',opts:['🤝 Teşekkür ederim','😡 Bağırırım','🙈 Saklanırım'],a:0,p:'🧸'}],
'Günlük Kurallar':[{q:'Karşıdan karşıya geçerken ne yapmalıyız?',opts:['🚦 Işığı bekle','🏃 Koş','🙈 Bakmadan geç'],a:0,p:'🚦'},{q:'Yemekten önce ne yapmalıyız?',opts:['🧼 Ellerimizi yıkamak','📺 Televizyon izlemek','🛌 Uyumak'],a:0,p:'🧼'},{q:'Birisi konuşurken ne yapmalıyız?',opts:['👂 Dinlemek','🗣️ Sözünü kesmek','🏃 Gitmek'],a:0,p:'👂'}],
'Zıt Kavramlar':[{q:'Hangisi büyüktür?',opts:['🐘 Fil','🐭 Fare'],a:0,p:'🐘↔️🐭'},{q:'Hangisi sıcaktır?',opts:['☀️ Güneş','❄️ Kar'],a:0,p:'☀️↔️❄️'},{q:'Hangisi uzundur?',opts:['🦒 Zürafa','🐢 Kaplumbağa'],a:0,p:'🦒↔️🐢'},{q:'Hangisi hızlıdır?',opts:['🚗 Araba','🐌 Salyangoz'],a:0,p:'🚗↔️🐌'}]
};
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')};function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function home(){document.getElementById('app').innerHTML=`<header class="top"><div class="brand">Dil<span>Terapi</span></div><div class="sub">Görsel dil, konuşma ve pragmatik beceri çalışmaları</div></header><div class="grid">${[['5N1K','🧩','Kim, ne, nerede, ne zaman, neden, nasıl'],['Evet / Hayır','✅','Doğru cevabı bul'],['Duygular','❤️','Duyguyu tanı'],['Duygu Nedenleri','🧠','Neden böyle hissediyor?'],['Empati','🤝','Sosyal durumları anla'],['Günlük Kurallar','🚦','Günlük yaşam kuralları'],['Zıt Kavramlar','↔️','Büyük-küçük, sıcak-soğuk'],['Olay Sıralama','🔢','Olayları doğru sıraya koy'],['Cümle Oluşturma','🧱','1–5+ kelimelik cümleler'],['Eylem İsimlendirme','🏃','75 temel eylem'],['Ekler','🔤','Türkçe ekleri çalış'],['Kelime Kategorileri','📚','Taşıt, meyve, sebze...']].map(x=>`<button class="menu" onclick="show('${x[0]}')"><div class="ico">${x[1]}</div><b>${x[0]}</b><small>${x[2]}</small></button>`).join('')}</div>`}
function show(type){if(type==='activities'){home();return}if(type==='categories'){categories();return}if(type==='Olay Sıralama'){sequence();return}if(type==='Cümle Oluşturma'){sentences();return}if(type==='Eylem İsimlendirme'){actions();return}if(type==='Ekler'){suffixes();return}if(type==='Kelime Kategorileri'){categories();return}let arr=data[type]||data['5N1K'];let i=0;renderQuiz(type,arr,i)}
function renderQuiz(type,arr,i){let d=arr[i%arr.length];document.getElementById('app').innerHTML=`<div class="section"><button class="back" onclick="home()">← Ana sayfa</button><span class="pill">${type}</span><div class="title">${type}</div><div class="hint">Kartı incele ve doğru seçeneğe dokun.</div><div class="card"><div class="visual">${d.p}</div><div class="body"><div class="q">${d.q}</div><div class="options">${d.opts.map((o,k)=>`<button class="opt" onclick="answer(this,${k},${d.a},'${type}',${i})">${o}</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="next" onclick="renderQuiz('${type}',data['${type}'],${i+1})">Sonraki Kart →</button></div></div></div>`}
function answer(btn,k,a,type,i){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);let fb=document.getElementById('fb');if(k===a){btn.classList.add('good');fb.textContent='⭐ Harika! Doğru cevap.';fb.style.color='var(--good)'}else{btn.classList.add('bad');fb.textContent='🔄 Tekrar düşünelim.';fb.style.color='var(--bad)';document.querySelectorAll('.opt')[a].classList.add('good')}}
function sequence(){let items=[['🌅','Sabah kalkar.'],['🧼','Yüzünü yıkar.'],['🍳','Kahvaltı yapar.'],['🎒','Çantasını alır.'],['🏫','Okula gider.']];let shuffled=[...items].sort(()=>Math.random()-.5);document.getElementById('app').innerHTML=`<div class="section"><button class="back" onclick="home()">← Ana sayfa</button><span class="pill">OLAY SIRALAMA</span><div class="title">Okula hazırlanıyorum</div><div class="hint">Kartları 1’den 5’e doğru sırala.</div><div class="sort">${shuffled.map((x,i)=>`<div class="sortcard"><div class="num">${i+1}</div><div style="font-size:36px">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div><button class="next" onclick="toast('Kartları sıralama kontrolü sonraki sürümde geliştirilecek')">Sıralamamı Kontrol Et</button></div>`}
function sentences(){let words=['Çocuk','koşuyor','topu','bahçede','oynuyor'];document.getElementById('app').innerHTML=`<div class="section"><button class="back" onclick="home()">← Ana sayfa</button><span class="pill">CÜMLE OLUŞTURMA</span><div class="title">Cümleyi oluştur</div><div class="hint">Önce 1 kelime, sonra 2–5 kelimeye ilerle.</div><div class="card"><div class="visual">👦🏃⚽</div><div class="body"><div class="q">Çocuğun yaptığı işi anlat.</div><div class="sentence" id="sentence"></div><div class="row">${words.map(w=>`<button class="word" onclick="addWord('${w}')">${w}</button>`).join('')}</div><button class="next" onclick="document.getElementById('sentence').innerHTML='';toast('Yeni cümle')">Temizle</button></div></div></div>`}
function addWord(w){document.getElementById('sentence').insertAdjacentHTML('beforeend',`<span class="token">${w}</span>`)}
function actions(){document.getElementById('app').innerHTML=`<div class="section"><button class="back" onclick="home()">← Ana sayfa</button><span class="pill">EYLEM İSİMLENDİRME</span><div class="title">75 temel eylem</div><div class="hint">Görsele bak, eylemin adını söyle.</div><div class="list">${A.slice(0,75).map(x=>`<button class="cat" onclick="toast('${x[0]}')"><span>${x[1]}</span>${x[0]}</button>`).join('')}</div></div>`}
function suffixes(){let x=[['-A / -E','Çocuk kapıya koşuyor.','Nereye? → kapıya'],['-I / -İ','Çocuk elmayı yiyor.','Neyi? → elmayı'],['-DA / -DE','Çocuk okulda.','Nerede? → okulda'],['-DAN / -DEN','Çocuk evden çıktı.','Nereden? → evden'],['-LER / -LAR','Çocuklar oynuyor.','Birden fazla kişi']];document.getElementById('app').innerHTML=`<div class="section"><button class="back" onclick="home()">← Ana sayfa</button><span class="pill">EKLER</span><div class="title">Türkçe ekleri görselle öğren</div><div class="cards">${x.map(a=>`<div class="card"><div class="visual">🧒${a[0].includes('DA')?'🏫':'🏃'}</div><div class="body"><div class="q">${a[0]}</div><p>${a[1]}</p><span class="pill">${a[2]}</span></div></div>`).join('')}</div></div>`}
function categories(){let cats=[['🚗','Taşıtlar','Araba • Kamyon • Otobüs • Tren • Uçak'],['🥬','Sebzeler','Lahana • Marul • Havuç • Domates'],['🍎','Meyveler','Elma • Armut • Muz • Portakal'],['🐶','Hayvanlar','Kedi • Köpek • Kuş • Balık'],['👕','Giysiler','Tişört • Pantolon • Ayakkabı'],['🍴','Yiyecekler','Ekmek • Peynir • Çorba • Yumurta'],['🏠','Ev Eşyaları','Masa • Sandalye • Yatak • Dolap'],['👷','Meslekler','Polis • Doktor • Öğretmen • Aşçı'],['🎒','Okul','Kalem • Kitap • Çanta • Defter']];document.getElementById('app').innerHTML=`<div class="section"><button class="back" onclick="home()">← Ana sayfa</button><span class="pill">KELİME KATEGORİLERİ</span><div class="title">Kelime dünyası</div><div class="hint">Kategoriyi seç ve kelimeleri görsel olarak çalış.</div><div class="list">${cats.map(c=>`<button class="cat" onclick="toast('${c[1]}')"><span>${c[0]}</span>${c[1]}<small style="display:block;color:#667085;margin-top:6px">${c[2]}</small></button>`).join('')}</div></div>`}
home();
</script></body></html>
